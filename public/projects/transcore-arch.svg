<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive">
  <title>Hand-drawn architecture sketch of the TransCore AI support chatbot</title>
  <rect width="800" height="500" fill="#faf6ee"/>

  <!-- notebook ruling -->
  <g stroke="#2b2620" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="60" x2="800" y2="60"/><line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="180" x2="800" y2="180"/><line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="300" x2="800" y2="300"/><line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="420" x2="800" y2="420"/><line x1="0" y1="480" x2="800" y2="480"/>
  </g>

  <text x="30" y="42" font-size="24" fill="#b0552a" transform="rotate(-1.5 30 42)">how a toll question gets a safe answer ↴</text>

  <!-- user -->
  <g>
    <circle cx="80" cy="150" r="16" fill="none" stroke="#2b2620" stroke-width="2.2"/>
    <path d="M80,166 C80,186 80,192 80,198 M62,178 L98,178 M80,198 L66,222 M80,198 L94,222" fill="none" stroke="#2b2620" stroke-width="2.2" stroke-linecap="round"/>
    <text x="48" y="248" font-size="17" fill="#2b2620">customer</text>
    <text x="36" y="270" font-size="14" fill="#6b6152">"why was I charged twice?"</text>
  </g>

  <!-- arrow user -> guardrails -->
  <path d="M126,180 C160,172 185,176 212,180" fill="none" stroke="#8a7f6d" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 6"/>
  <path d="M204,174 L214,180 L203,186" fill="none" stroke="#8a7f6d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- guardrails box -->
  <path d="M224,142 C280,138 330,140 342,146 C348,168 348,196 342,216 C300,222 250,222 226,216 C218,192 218,162 224,142 Z" fill="#fffdf8" stroke="#2b2620" stroke-width="2.2" stroke-linejoin="round"/>
  <text x="240" y="172" font-size="18" fill="#2b2620">guardrails</text>
  <text x="234" y="194" font-size="13" fill="#6b6152">input sanitization +</text>
  <text x="234" y="210" font-size="13" fill="#6b6152">semantic routing</text>
  <text x="228" y="130" font-size="14" fill="#b0552a" transform="rotate(-2 228 130)">blocks prompt injection!</text>

  <!-- arrow guardrails -> RAG -->
  <path d="M350,180 C390,172 420,176 450,180" fill="none" stroke="#8a7f6d" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 6"/>
  <path d="M442,174 L452,180 L441,186" fill="none" stroke="#8a7f6d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- RAG box -->
  <path d="M462,140 C530,136 580,138 594,144 C600,168 600,198 594,218 C540,226 490,226 464,218 C456,192 456,162 462,140 Z" fill="#fffdf8" stroke="#2b2620" stroke-width="2.2" stroke-linejoin="round"/>
  <text x="490" y="172" font-size="18" fill="#2b2620">RAG pipeline</text>
  <text x="478" y="194" font-size="13" fill="#6b6152">retrieves real company</text>
  <text x="478" y="210" font-size="13" fill="#6b6152">docs, live</text>

  <!-- docs stack doodle -->
  <g stroke="#2b2620" stroke-width="1.8" fill="#fffdf8" stroke-linejoin="round">
    <rect x="640" y="120" width="70" height="88" rx="3" transform="rotate(4 675 164)"/>
    <rect x="648" y="114" width="70" height="88" rx="3" transform="rotate(-3 683 158)"/>
  </g>
  <g stroke="#8a7f6d" stroke-width="1.5" stroke-linecap="round">
    <line x1="660" y1="134" x2="702" y2="132"/><line x1="660" y1="148" x2="702" y2="146"/>
    <line x1="660" y1="162" x2="694" y2="160"/><line x1="660" y1="176" x2="702" y2="174"/>
  </g>
  <text x="632" y="232" font-size="14" fill="#6b6152">toll docs + FAQs</text>
  <path d="M636,160 C620,164 610,168 600,172" fill="none" stroke="#8a7f6d" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 6"/>

  <!-- arrow RAG down to models -->
  <path d="M528,226 C524,250 522,266 522,286" fill="none" stroke="#8a7f6d" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 6"/>
  <path d="M516,278 L522,289 L529,278" fill="none" stroke="#8a7f6d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- local models box -->
  <path d="M400,296 C500,290 610,292 648,298 C656,330 656,392 648,420 C560,430 460,430 402,420 C392,384 392,326 400,296 Z" fill="#fffdf8" stroke="#2b2620" stroke-width="2.2" stroke-linejoin="round"/>
  <text x="424" y="330" font-size="18" fill="#2b2620">local LLMs via Ollama</text>
  <text x="424" y="356" font-size="14" fill="#6b6152">quantized Qwen · Mistral · LLaMA</text>
  <text x="424" y="378" font-size="14" fill="#6b6152">+ LoRA fine-tune for empathetic tone</text>
  <text x="424" y="404" font-size="13" fill="#b0552a">data never leaves the building ✓</text>

  <!-- LLM judge sticky note -->
  <g transform="rotate(3 200 360)">
    <rect x="140" y="316" width="164" height="96" fill="#fff4a3"/>
    <text x="154" y="344" font-size="15" fill="#57503a">LLM judge grades</text>
    <text x="154" y="364" font-size="15" fill="#57503a">every reply for</text>
    <text x="154" y="384" font-size="15" fill="#57503a">de-escalation +</text>
    <text x="154" y="404" font-size="15" fill="#57503a">professionalism</text>
  </g>
  <path d="M310,356 C340,352 366,354 392,358" fill="none" stroke="#8a7f6d" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 6"/>

  <!-- answer arrow back to user -->
  <path d="M396,428 C300,470 160,440 92,280" fill="none" stroke="#b0552a" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="3 7"/>
  <path d="M85,292 L91,277 L100,290" fill="none" stroke="#b0552a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="180" y="474" font-size="16" fill="#b0552a" transform="rotate(-2 180 474)">grounded, polite, safe answer</text>
</svg>
